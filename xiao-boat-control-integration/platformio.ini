# Proposal evaluation builds: BOAT_EXPERIMENT=23 remains the sensor baseline.
# These flags only expose the host/replay campaign identity; actuator output is hard-disabled.
[env:proposal_benchmark_base]
extends = env:seeed_xiao_esp32s3
build_flags =
  ${env:seeed_xiao_esp32s3.build_flags}
  -DBOAT_EXPERIMENT=23
  -DBENCHMARK_ENABLE=1
  -DSHADOW_CONTROL_ENABLE=1
  -DACTUATOR_OUTPUT_ENABLE=0
  -DPROPOSAL_PROFILE=0

[env:proposal_replay_min]
extends = env:seeed_xiao_esp32s3
build_flags =
  ${env:seeed_xiao_esp32s3.build_flags}
  -DBOAT_EXPERIMENT=23
  -DREPLAY_ENABLE=1
  -DSHADOW_CONTROL_ENABLE=1
  -DACTUATOR_OUTPUT_ENABLE=0
  -DPROPOSAL_PROFILE=1

