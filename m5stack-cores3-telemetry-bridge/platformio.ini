[env:m5stack-cores3]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  m5stack/M5Unified
[env:competition_cores3_shadow]
extends = env:m5stack-cores3
build_flags =
  ${env:m5stack-cores3.build_flags}
  -DSHADOW_CONTROL_ENABLE=1
  -DACTUATOR_OUTPUT_ENABLE=0
  -DCOMPETITION_SHADOW_ENABLE=1

[env:competition_cores3_hardware]
extends = env:m5stack-cores3
# CoreS3 USB-Serial/JTAG: ROM flashing avoids the stub verification failure observed on COM6.
upload_flags =
  --no-stub
build_flags =
  ${env:m5stack-cores3.build_flags}
  -DSHADOW_CONTROL_ENABLE=0
  -DACTUATOR_OUTPUT_ENABLE=1
  -DCOMPETITION_HARDWARE_ENABLE=1
